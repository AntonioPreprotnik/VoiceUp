name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: desktop

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run licenses

  package:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - name: Check installer size
        shell: bash
        run: node scripts/check-installer-size.mjs dist/*.exe
      - name: Read fuses back
        run: node scripts/check-fuses.mjs dist/win-unpacked/VoiceUp.exe
      - name: Smoke test
        timeout-minutes: 5
        shell: pwsh
        run: ./scripts/smoke-test.ps1
      # The updater (S7.4) needs latest.yml and the blockmap beside the installer.
      - uses: actions/upload-artifact@v7
        with:
          name: VoiceUp-${{ github.sha }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.exe.blockmap
            desktop/dist/latest.yml
          if-no-files-found: error

  # A v* tag makes a draft GitHub Release from the package job's tested build (TECH_SPEC §7.3).
  # Installed copies update from it once Antonio publishes the draft (S7.4).
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, package]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: release
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: VoiceUp-${{ github.sha }}
          path: release
      - name: Check the build is the tagged version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version: //p' latest.yml)"
          test "v$version" = "$TAG" || { echo "latest.yml says $version, the tag is $TAG"; exit 1; }
          test -f "VoiceUp-Setup-$version.exe" || { echo "No VoiceUp-Setup-$version.exe"; exit 1; }
      - name: Write checksums
        run: sha256sum VoiceUp-Setup-*.exe > SHA256SUMS.txt
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          notes="Install guide: https://github.com/$REPO/blob/$TAG/docs/install.md (Windows warns about an unknown publisher, and the guide explains it). Check the download against SHA256SUMS.txt."
          gh release create "$TAG" --repo "$REPO" --draft --title "VoiceUp $TAG" --notes "$notes" \
            VoiceUp-Setup-*.exe VoiceUp-Setup-*.exe.blockmap latest.yml SHA256SUMS.txt

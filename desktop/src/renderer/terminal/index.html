<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>VoiceUp</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; media-src 'self' blob:"
    />
    <style>
      html,
      body,
      #terminal {
        height: 100%;
        margin: 0;
        background: #0c0c0c;
        overflow: hidden;
      }
      /* Above xterm's layers, which go up to z-index 11 and would otherwise take the clicks. */
      #session-exited {
        position: fixed;
        z-index: 100;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 16px;
        background: rgb(12 12 12 / 80%);
        color: #f0f0f0;
        font:
          16px 'Segoe UI',
          sans-serif;
        text-align: center;
      }
      #session-exited[hidden] {
        display: none;
      }
      #restart-session {
        min-width: 160px;
        padding: 10px 20px;
        border: 0;
        border-radius: 3px;
        background: #0e639c;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      #restart-session:hover,
      #restart-session:focus-visible {
        background: #1177bb;
      }
      #restart-session:active {
        background: #094771;
      }
      #restart-session:disabled {
        background: #4d4d50;
        color: #cccccc;
        cursor: progress;
      }
      #session-command {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      #session-command[hidden] {
        display: none;
      }
      #session-command-text {
        padding: 8px 12px;
        border-radius: 3px;
        background: #2d2d30;
        font-family: 'Cascadia Mono', Consolas, monospace;
        user-select: text;
      }
      #copy-command {
        padding: 8px 12px;
        border: 1px solid #6e6e6e;
        border-radius: 3px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      #copy-command:hover,
      #copy-command:focus-visible {
        background: #3a3a3d;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <div id="session-exited" role="alert" hidden>
      <span id="session-exited-text"></span>
      <div id="session-command" hidden>
        <code id="session-command-text"></code>
        <button id="copy-command" type="button">Copy command</button>
      </div>
      <button id="restart-session" type="button">Restart session</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

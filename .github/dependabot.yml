version: 2
updates:
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    versioning-strategy: increase
    ignore:
      # Majors are planned upgrades, not weekly updates (PLAN.md dependency hygiene). Electron needs
      # a packaged native module check, and TypeScript 7 waits for typescript-eslint.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

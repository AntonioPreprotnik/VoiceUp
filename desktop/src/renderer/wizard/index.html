<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>VoiceUp setup</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; media-src 'self' blob:"
    />
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        background: #1e1e20;
        color: #f0f0f0;
        font:
          15px/1.5 'Segoe UI',
          sans-serif;
      }
      #steps {
        flex: 0 0 210px;
        margin: 0;
        padding: 24px 16px;
        list-style: none;
        background: #161618;
      }
      #steps li {
        padding: 6px 8px;
        border-radius: 6px;
        color: #a8a8a8;
      }
      #steps li[aria-current='step'] {
        background: #2c2c30;
        color: #f0f0f0;
      }
      #steps li[data-done='true']::before {
        content: '✓ ';
        color: #4ec9b0;
      }
      main {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
        padding: 24px 32px;
      }
      #position {
        margin: 0;
        color: #a8a8a8;
        font-size: 13px;
      }
      h1 {
        margin: 4px 0 12px;
        font-size: 24px;
        font-weight: 600;
      }
      p {
        margin: 0 0 8px;
      }
      #notice {
        color: #a8a8a8;
      }
      [hidden] {
        display: none !important;
      }
      #claude {
        display: flex;
        flex: 1;
        flex-direction: column;
        min-height: 0;
      }
      #claude-command,
      #folder-path {
        display: block;
        margin: 0 0 8px;
        padding: 6px 10px;
        border-radius: 6px;
        background: #111113;
        font:
          13px Consolas,
          monospace;
        overflow-wrap: anywhere;
      }
      #claude-git {
        color: #a8a8a8;
        font-size: 13px;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      #claude-output {
        flex: 1;
        min-height: 60px;
        margin: 0 0 12px;
        padding: 8px 10px;
        overflow: auto;
        border-radius: 6px;
        background: #111113;
        font:
          12px Consolas,
          monospace;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      #error {
        color: #f48771;
      }
      nav {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: auto;
      }
      button {
        padding: 6px 20px;
        border: 1px solid #55555a;
        border-radius: 6px;
        background: #2c2c30;
        color: inherit;
        font: inherit;
      }
      button:focus-visible {
        outline: 2px solid #4ec9b0;
        outline-offset: 2px;
      }
      button:disabled {
        opacity: 0.45;
      }
      #continue {
        border-color: #4ec9b0;
        background: #1f6f5f;
      }
    </style>
  </head>
  <body>
    <ol id="steps"></ol>
    <main>
      <p id="position"></p>
      <h1 id="title"></h1>
      <p id="detail"></p>
      <p id="notice" hidden>This step isn't ready yet, so you can just continue.</p>
      <div id="folder" hidden>
        <p id="folder-message"></p>
        <code id="folder-path" hidden></code>
        <p class="actions">
          <button id="folder-choose" type="button">Choose folder</button>
        </p>
      </div>
      <div id="claude" hidden>
        <p id="claude-message"></p>
        <code id="claude-command" hidden></code>
        <p id="claude-git" hidden>Git for Windows is optional, so you don't need it for this.</p>
        <p class="actions">
          <button id="claude-install" type="button" hidden>Install</button>
          <button id="claude-check" type="button" hidden>Check again</button>
        </p>
        <pre id="claude-output" hidden></pre>
      </div>
      <p id="error" hidden></p>
      <nav>
        <button id="back" type="button">Back</button>
        <button id="continue" type="button">Continue</button>
      </nav>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

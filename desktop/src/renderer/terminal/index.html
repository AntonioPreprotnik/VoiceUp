<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>VoiceUp</title>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; media-src 'self' blob:"
    />
    <style>
      html,
      body,
      #terminal {
        height: 100%;
        margin: 0;
        background: #0c0c0c;
        overflow: hidden;
      }
      #session-exited {
        position: fixed;
        inset: auto 0 0 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 10px 16px;
        background: #2d2d30;
        color: #f0f0f0;
        font:
          14px 'Segoe UI',
          sans-serif;
      }
      #session-exited[hidden] {
        display: none;
      }
      #restart-session {
        padding: 6px 14px;
        border: 0;
        border-radius: 3px;
        background: #0e639c;
        color: #fff;
        font: inherit;
        cursor: pointer;
      }
      #restart-session:hover,
      #restart-session:focus-visible {
        background: #1177bb;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <div id="session-exited" role="alert" hidden>
      <span id="session-exited-text"></span>
      <button id="restart-session" type="button">Restart session</button>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
